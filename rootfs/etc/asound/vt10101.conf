# ALSA's default on the VT10101 (/etc/asound.conf): its card "VT10101" has
# one mono playback channel at 44.1/48 kHz, so the dmix is mono at 48 kHz and
# plug downmixes a stereo stream into it. asound.state beside it is the
# card's mixer state as tuned on the glass (alsactl restore -f).
pcm.!default {
	type plug
	slave.pcm "frame_mix"
}
pcm.frame_mix {
	type dmix
	ipc_key 47811
	ipc_key_add_uid false
	ipc_perm 0660
	ipc_gid audio
	slave {
		pcm "hw:0,0"
		format S16_LE
		rate 48000
		channels 1
		period_size 960
		buffer_size 3840
	}
}
ctl.!default {
	type hw
	card 0
}
