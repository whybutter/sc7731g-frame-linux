# c3-bt-raw -- an ESP32-C3 Super Mini as the known BLE transmitter (and a raw
# scanner) for the VT10101's raw-radio LE experiment; everything it does on
# BLE is in bt_raw_c3.h (docs/bluetooth.md, bt4-bt7). It runs on any USB
# power near the frame and is driven over the LAN:
#   curl http://<c3>/switch/advertising/state        (advertising on/off)
#   curl -X POST -d x http://<c3>/switch/advertising/turn_off   (and turn_on)
#   curl -N http://<c3>/events     (live log, incl. the scanner's lines)
# mDNS name c3-bt-raw.local; the bt-raw scripts take its URL from C3_URL.
# Flash (USB the first time, OTA after), from this directory, with your own
# secrets.yaml (wifi_ssid, wifi_password, ota_password):
#   esphome run c3-bt-raw.yaml --device /dev/ttyACM0|<c3-ip>
#
# Wi-Fi and BLE share the C3's one radio and take turns (coexistence), so the
# 100 ms advertising is a little less regular and the scanner sees fewer
# adverts than with Wi-Fi off -- acceptable for this.
esphome:
  name: c3-bt-raw
  min_version: 2026.4.0
  includes:
    - bt_raw_c3.h
  on_boot:
    priority: -100
    then:
      - delay: 2s
      - lambda: bt_raw::start();

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: esp-idf

logger:
  hardware_uart: USB_SERIAL_JTAG
  level: INFO

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # the Super Mini's antenna problem: at full power it failed to associate. Power save stays at
  # its default: with BLE on, ESP-IDF requires Wi-Fi modem sleep for
  # coexistence, so "none" would abort.
  output_power: 8.5dB

mdns:

ota:
  - platform: esphome
    password: !secret ota_password

# no auth: a lab beacon on a trusted LAN; it exposes one switch and its log
web_server:
  port: 80
  version: 3
  log: true

esp32_ble:

switch:
  - platform: template
    name: advertising
    id: advertising
    optimistic: true
    restore_mode: ALWAYS_ON
    turn_on_action:
      - lambda: bt_raw::set_advertising(true);
    turn_off_action:
      - lambda: bt_raw::set_advertising(false);
